<!DOCTYPE html>
<!--
  Newsprint is defined in the @theme block in src/styles.css and is what the
  app renders as. The alternate, desk-night, lives in src/themes.css; switch
  to it by changing `data-theme` below to any id listed in src/themes.ts.
-->
<html lang="en" data-theme="newsprint">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" />
    <title>Prospect Desk</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap"
    />
    <!--
      First-paint background, keyed to the data-theme attribute above.
      Without this the browser paints its own default until the CSS bundle
      arrives. Each value mirrors --color-background for that theme; keep
      them in sync when adding or editing a theme.
    -->
    <style>
      html { background-color: #faf8f4; color-scheme: light; }
      html[data-theme="desk-night"] { background-color: #16150f; color-scheme: dark; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
